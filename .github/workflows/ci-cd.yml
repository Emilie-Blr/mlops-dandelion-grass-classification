name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-dandelion-grass-classification

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # (Optionnel) cache pip pour accélérer
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_freeze.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0" "torchvision==0.23.0" --no-cache-dir --progress-bar off

      - name: Install project dependencies (freeze, w/o torch/vision)
        run: |
          # retirer torch/vision du freeze pour éviter qu'ils soient réinstallés
          awk 'tolower($0) !~ /^torch==/ && tolower($0) !~ /^torchvision==/' requirements_freeze.txt > requirements_freeze_no_torch.txt
          # forcer les roues binaires quand c'est possible (moins de build from source)
          pip install -r requirements_freeze_no_torch.txt --only-binary=:all: --no-cache-dir --progress-bar off

      - name: Run pytest
        run: |
          pytest -q
        env:
          PYTHONWARNINGS: "ignore"

  build_and_push:
    name: Build & Push Docker
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          # si tu veux accélérer et éviter d'installer deps système à chaque fois, ajoute un cache:
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (self-hosted)
    needs: build_and_push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Pull latest image
        run: |
          docker pull ${{ env.DOCKER_IMAGE }}:latest

      # Adapte ces commandes à ton infra (docker run / docker compose)
      - name: Recreate container
        run: |
          # Arrête et supprime l'ancien conteneur s'il existe
          docker rm -f app || true
          # Lance le nouveau conteneur (exemple, adapte ports/vars)
          docker run -d --name app \
            -p 8080:8080 \
            --env-file .env \
            ${{ env.DOCKER_IMAGE }}:latest
