name: CI/CD Pipeline


on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_freeze.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_freeze.txt
    
    - name: Run linting
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        black --check src/
    
    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        service: [api, webapp]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push ${{ matrix.service }}
      uses: docker/build-push-action@v4
      with:
        context: .
        file: ./Dockerfile.${{ matrix.service }}
        push: true
        tags: |
          ${{ env.DOCKER_USERNAME }}/mlops-${{ matrix.service }}:latest
          ${{ env.DOCKER_USERNAME }}/mlops-${{ matrix.service }}:${{ env.IMAGE_TAG }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    # autorise le déploiement à la fois sur push(main) ET sur Run workflow
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, k8s]   # ↩︎ ton runner "XPS_EMI" a bien le label k8s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Write kubeconfig from secret (Windows/PowerShell)
        shell: pwsh
        run: |
          $bytes = [Convert]::FromBase64String("${{ secrets.KUBECONFIG_B64 }}")
          $kubeDir = Join-Path $env:USERPROFILE ".kube"
          New-Item -ItemType Directory -Path $kubeDir -Force | Out-Null
          $cfg = Join-Path $kubeDir "config"
          [IO.File]::WriteAllBytes($cfg, $bytes)
          Write-Host "Kubeconfig written to $cfg"

      - name: Update Kubernetes manifests (replace username + tag)
        shell: pwsh
        run: |
          $user = "${{ env.DOCKER_USERNAME }}"
          $tag  = "${{ env.IMAGE_TAG }}"
          Get-ChildItem -Path "k8s" -Filter *.yaml | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $c = $c -replace "YOUR_DOCKERHUB_USERNAME", $user
            $c = $c -replace ":latest", (":" + $tag)
            Set-Content -Path $_.FullName -Value $c -NoNewline
          }

      - name: Ensure namespace exists
        shell: pwsh
        run: |
          kubectl get ns mlops 2>$null
          if ($LASTEXITCODE -ne 0) { kubectl create ns mlops }

      - name: Deploy to Kubernetes
        shell: pwsh
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/api-deployment -n mlops --timeout=120s
          kubectl rollout status deployment/webapp-deployment -n mlops --timeout=120s

      - name: Verify deployment
        shell: pwsh
        run: |
          kubectl get pods -n mlops -o wide
          kubectl get svc -n mlops -o wide

  integration-test:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        pip install -r requirements_freeze.txt
    
    - name: Run integration tests
      run: |
        pytest tests/integration/ -v
      env:
        API_URL: ${{ secrets.API_URL }}
