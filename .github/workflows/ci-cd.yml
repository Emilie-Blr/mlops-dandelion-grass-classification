name: CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements_freeze.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install torch CPU wheels
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0" "torchvision==0.23.0" --no-cache-dir --progress-bar off

      - name: Install project dependencies (freeze, w/o torch/vision)
        run: |
          awk 'tolower($0) !~ /^torch==/ && tolower($0) !~ /^torchvision==/' requirements_freeze.txt > requirements_freeze_no_torch.txt
          pip install -r requirements_freeze_no_torch.txt --only-binary=:all: --no-cache-dir --progress-bar off

      - name: Run pytest
        run: |
          pytest -q
        env:
          PYTHONWARNINGS: "ignore"

  build_and_push:
    name: Build & Push Docker Images
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # === CORRECTION ICI ===
      # Nous avons besoin de 3 étapes de build, une pour chaque image.

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api  # On spécifie le bon fichier
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push WebApp
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.webapp # On spécifie le bon fichier
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-webapp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build and push Airflow
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.airflow # On spécifie le bon fichier
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mlops-airflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes (self-hosted)
    needs: build_and_push
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to K8s
        run: |
          echo "Application des manifestes Kubernetes..."
          # C'est la commande correcte pour votre projet
          kubectl apply -f k8s/